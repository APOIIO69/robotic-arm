#VRML_SIM R2023b utf8
PROTO RoboArmL2 [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFFloat    shoulderLength 0.45
  field SFFloat    forearmLength  0.4
  field SFString   controller "arm_controller"
]
{
  %<
    let shoulderLength = fields.shoulderLength.value;
    if (shoulderLength <= 0) shoulderLength = 0.45;
    let forearmLength = fields.forearmLength.value;
    if (forearmLength <= 0) forearmLength = 0.4;
  >%
  Robot {
    translation IS translation
    rotation IS rotation
    children [
      # Визуальное основание
      Shape {
        appearance PBRAppearance { baseColor 0.2 0.2 0.2 roughness 1 }
        geometry DEF BASE_GEOM Cylinder { height 0.2 radius 0.25 }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0 0 0.15
          dampingConstant 1.0
        }
        device [
          RotationalMotor { name "base_motor" }
          PositionSensor { name "base_sensor" }
        ]
        endPoint Solid {
          name "shoulder"
          translation 0 0 0.15
          children [
            Transform {
              translation 0 0 %<= shoulderLength / 2 >%
              children [
                Shape {
                  appearance PBRAppearance { baseColor 0.8 0.1 0.1 roughness 1 }
                  geometry DEF SHOULDER_GEOM Box { size 0.05 0.05 %<= shoulderLength >% }
                }
              ]
            }
            HingeJoint {
              jointParameters HingeJointParameters {
                axis 0 1 0
                anchor 0 0 %<= shoulderLength >%
                dampingConstant 0.5
              }
              device [
                RotationalMotor { name "elbow_motor" }
                PositionSensor { name "elbow_sensor" }
              ]
              endPoint Solid {
                name "forearm"
                translation 0 0 %<= shoulderLength >%
                children [
                  Transform {
                    translation 0 0 %<= forearmLength / 2 >%
                    children [
                      Shape {
                        appearance PBRAppearance { baseColor 0.1 0.1 0.8 roughness 1 }
                        geometry DEF FOREARM_GEOM Box { size 0.04 0.04 %<= forearmLength >% }
                      }
                    ]
                  }
                ]
                boundingObject Transform {
                  translation 0 0 %<= forearmLength / 2 >%
                  children [ USE FOREARM_GEOM ]
                }
                physics Physics { density -1 mass 0.5 }
              }
            }
          ]
          boundingObject Transform {
            translation 0 0 %<= shoulderLength / 2 >%
            children [ USE SHOULDER_GEOM ]
          }
          physics Physics { density -1 mass 0.8 }
        }
      }
    ]
    name "robotic_arm"
    boundingObject USE BASE_GEOM
    # immoblie TRUE делает базу неподвижной, но позволяет работать физике суставов
    static TRUE 
    physics Physics {
      density -1
      mass 10
    }
    controller IS controller
  }
}
